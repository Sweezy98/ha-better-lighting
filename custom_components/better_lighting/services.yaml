press:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:
    controller:
      selector:
        text:
    kind:
      default: press
      selector:
        select:
          options:
            - press
            - double_press
            - long_press

cycle:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:
    controller:
      selector:
        text:
    direction:
      default: next
      selector:
        select:
          options:
            - next
            - previous

set_adaptive:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:

activate_scene:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:
    scene:
      required: true
      selector:
        text:

clear_manual_override:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:
    lights:
      selector:
        entity:
          domain: light
          multiple: true

set_mode:
  fields:
    mode:
      required: true
      selector:
        text:
    state:
      required: true
      selector:
        text:

end_mode:
  fields:
    mode:
      required: true
      selector:
        text:
    restore:
      default: true
      selector:
        boolean:

rejoin_mode:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    mode:
      required: true
      selector:
        text:
    zone:
      selector:
        text:

night_lights_off:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:

notify:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:
    lights:
      selector:
        entity:
          domain: light
          multiple: true
    effect:
      default: flash
      selector:
        text:
    duration:
      default: 3
      selector:
        number:
          min: 0.2
          max: 600
          step: 0.1
          unit_of_measurement: s
    brightness_pct:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    rgb_color:
      selector:
        color_rgb:
    color_temp_kelvin:
      selector:
        number:
          min: 1000
          max: 10000
          step: 50
          unit_of_measurement: K

apply_effect:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:
    lights:
      selector:
        entity:
          domain: light
          multiple: true
    effect:
      default: breathe
      selector:
        text:
    duration:
      default: 0
      selector:
        number:
          min: 0
          max: 600
          step: 0.1
          unit_of_measurement: s
    brightness_pct:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    rgb_color:
      selector:
        color_rgb:
    color_temp_kelvin:
      selector:
        number:
          min: 1000
          max: 10000
          step: 50
          unit_of_measurement: K

stop_effect:
  target:
    entity:
      integration: better_lighting
      domain:
        - light
        - select
  fields:
    zone:
      selector:
        text:
