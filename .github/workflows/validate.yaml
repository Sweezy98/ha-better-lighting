name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      # scenery's workflow omits this step; the HACS action needs the repo contents.
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # The brands check requires an accepted pull request to
          # home-assistant/brands, which is a separate repository. Remove this
          # line once https://github.com/home-assistant/brands has merged the
          # better_lighting icon and logo.
          ignore: brands
